services:
  - type: web
    name: kale-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HMS_DATABASE_URL
        sync: false
      - key: HMS_SECRET_KEY
        generateValue: true
      - key: HMS_CORS_ORIGINS
        value: https://kale-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.12.4

  - type: web
    name: kale-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://kale-backend-g6s8.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
